# gate.yml — how docs is gated, declared rather than guessed.
#
# WHY THIS FILE IS HERE. `cafaye/core` owns the format
# (`schemas/gate.schema.json`), the checker (`harness/gate_check.py`) and the
# reasoning (`docs/gate.md`). Six repositories declared their gate and this is
# the seventh. The consequence is not cosmetic: `bin/prime` exists in thirteen
# repositories and what it is *worth* was written down in six, so a developer
# here ran `bin/prime`, saw green, and learned nothing about whether it could
# detect anything. A checker here replaced by `exit 0` would have left this
# repository green. Every number below was measured on THIS tree by running the
# declared command; none of them was copied from another repository's file.
#
# WHAT THE CHECKER PROVES ABOUT THIS FILE, AND WHAT IT DOES NOT. It proves the
# command runs, the entrypoint exists and is executable, `mise run prime`
# resolves to that same file, the CI workflow really invokes the declared argv,
# and — the part that matters — that running the declared command makes each of
# the eight lines below appear, the five countable ones at or above their floors.
# It does NOT prove the tests touched `core` or the `caf` binary it names. That
# is `tests/contracts.mjs` asserting both prerequisites in its own first two
# tests, and this file's `contract-tier-ran` proof is what makes the tier
# optional to nobody.
#
# THE THING THAT WAS WORTH MEASURING: THE THREE COMMANDS ARE NOT ONE COMMAND.
# This repository has three spellings of "run the gate", and they are not
# equal. All three were run on this tree:
#
#   mise run prime            -> ./bin/prime              16 tests, contract tier NOT run
#   CI's `gate` job           -> bin/prime                 16 tests, + 3 assertions bin/prime
#                                                            does not make (see below)
#   CI's `contracts` job      -> bin/prime --contracts     22 tests (16 offline + 6 contract)
#
# `bin/prime` says out loud that the contract tier did not run, and it is right
# to: those six tests are the only ones that can catch a documented example
# contradicting something that has actually shipped, and they need a `core`
# checkout and a `caf` binary that a contributor with one clone does not have.
# So the flag is not a gate that is hidden behind a flag — it is a second tier
# with two real prerequisites, and CI runs it as its own job and fails the build
# if it did not run.
#
# WHY `command` IS THE FLAG AND NOT THE BARE DEFAULT. Because declaring
# `[bin/prime]` would be true and useless. The declaration would be satisfied by
# a run that checked sixteen properties of the text and validated **zero**
# manifests against core's real schema — and `gate-check --prove` would print
# green, which is the exact false green this format exists to end. `muse`'s
# declaration carries the same argument for the same reason (its three skipped
# tests are the only ones that catch vendored specs drifting), and `darkroom`'s
# declares `--db` because `./bin/prime` reports 41 `#[ignore]`d database tests
# as `ignored` and exits 0. Declaring the subset is declaring the badge.
#
# **AND THE COST, stated because it is real.** `bin/prime --contracts` is not
# what a contributor with one checkout can run. It needs `external.requirements`
# below satisfied, and this file says so rather than pretending the gate is
# hermetic. The cheap way back to the subset is to delete the `--contracts` from
# `command` and the four proofs anchored on `== npm run test:contracts`; the
# count of 16 is unaffected and the gate goes green over an unrun tier again.
#
# ── THE RED PROOFS: THIS DECLARATION HAS BEEN OBSERVED FAILING ────────────
#
# A gate that has never been seen red is not a gate. All three of these were
# run against this file on this tree, and each is a different class of defect
# rather than three copies of one. Full transcripts, including what the gate
# itself reported while the checker was red, are in `REPORT-docs-06-gate.md`.
#
#   1. `tests/links.mjs` and `tests/examples.mjs` removed from the `test`
#      script — the two files AGENTS.md calls "the whole deliverable".
#      **`bin/prime` exited 0**, 7 tests / 7 pass / 0 skipped. The checker said
#      `gate.floor: proof 'offline-suite' reported 7 and the declaration's floor
#      is 16`, and said *nothing else* — the absence of a `gate.nonzero` finding
#      is the record that the gate itself was green. This is the packet's own
#      premise, run: a developer deletes the checks to reach green, the local
#      gate stays green, and the declaration is what notices.
#
#   2. `CORE_PATH` pointed at an empty directory. Four findings, and the point
#      is the shape: `gate.nonzero: the gate exited 1`, `gate.floor: proof
#      'contract-tier-ran' reported 3 and the declaration's floor is 6`, and
#      `gate.proof-missing` for both `event-claims-checked` and
#      `span-names-checked`. Three of the six contract tests still passed,
#      because three of them do not read `core`. **Nothing skipped** — an
#      unreadable core is a failure that names itself, which is the property
#      `tests/contracts.mjs` was written to have and the reason it is a separate
#      tier rather than a skip.
#
#   3. **`CAF=/usr/bin/true`.** This is the one worth reading twice, because it
#      is the packet's premise verbatim: "a checker replaced by a function that
#      unconditionally exits 0 would leave this repository green."
#      It nearly did. All 22 tests passed — 16 offline, 6 contract, 0 failed, 0
#      skipped, exit 0 — including `ok 3 - every cafaye.yml example in the docs
#      passes the real caf validator`, and the tier went on printing
#      `manifests validated by caf contract lint: 2`. The count-based proof was
#      satisfied by the stub, because that `console.log` lives in the test and
#      not in `caf`. The one thing that changed in the whole log is that
#      `caf contract lint`'s own stdout line, `# OK …/cafaye.yml`, stopped being
#      printed — so the declaration reported exactly one failure,
#      `gate.proof-missing: proof 'caf-lint-output' never appeared`, and named
#      the proof that had been defeated.
#
# That third one is why `caf-lint-output` exists with no floor and no count in
# it. A proof that only counted things would have been green.
version: 1
name: docs

gate:
  # An argv, never a shell string, so the exit code is the gate's own. This
  # fleet's one recorded false green was `… | tail -45; echo "PRIME EXIT=$?"`
  # under zsh, where `$?` is `tail`'s and `tail` is always 0.
  #
  # It was not theoretical here. Measured on this machine while writing this
  # file: under zsh, `${PIPESTATUS[0]}` after `bin/prime | tee log` expands to
  # the **empty string**, and under bash to the gate's real status. So the fleet
  # defect reproduces from a shell that is the macOS default, and the spelling
  # in `.github/workflows/ci.yml` (`shell: bash` plus `${PIPESTATUS[0]}`) is not
  # defensive style — it is the only reading that is a status at all.
  command: [bin/prime, --contracts]
  # The fleet's spelling. **`mise run prime` runs `bin/prime` WITHOUT
  # `--contracts`, and that difference is real and is not fixed by this file.**
  # `mise run prime` is the fast local loop — no `core`, no `caf` — and the
  # declared gate is the fast loop plus the contract tier. It is recorded here
  # rather than reconciled because reconciling it means either renaming the
  # task, which would add a third spelling of "run the gate" in the very
  # repository this file exists to stop guessing at, or making a mise task
  # require a sibling checkout, which is the thing mise is not for. If you are
  # landing a change to a page with an example, an event type or a span name in
  # it, `./bin/prime --contracts` is the gate and `mise run prime` is a subset.
  #
  # It cannot be `prime:contracts`, which is the task that actually runs the
  # declared command: `gate.miseTask` is constrained to `^[a-z][a-z0-9-]*$` and
  # a colon is not in that class. So `prime` is named and the difference is
  # written down here, where a reader of the declaration will find it.
  miseTask: prime
  # The file behind both. `mise run prime`, the developer-facing command, and
  # CI's two jobs all resolve to this one file — which is what
  # `gate.task-unresolvable` exists to keep them agreeing about.
  entrypoint: bin/prime
  # 1200, and it is CI's own budget rather than a measurement: both the `gate`
  # and the `contracts` job in `.github/workflows/ci.yml` are
  # `timeout-minutes: 20`. Measured here on a warm npm cache, one full
  # two-tier run is about 75 seconds (npm ci 25s, the Astro build 21s, the
  # offline suite 5s, the contract tier 0.4s — re-measured as
  # `CORE_PATH=../core CAF=<caf> npm run test:contracts`, three runs at
  # 0.31/0.37/0.38s, of which node reports 0.13s of actual test time; the
  # 0.6s this line used to claim was the pre-change figure), so a floor tight
  # enough to be a bug detector would be tight enough to be a flake generator
  # on a cold runner, and a timeout that fires on a slow CI runner reads as a
  # red gate over nothing.
  timeoutSeconds: 1200
  proof:
    #
    # ── THE ANCHORING, AND WHY FOUR OF THESE EIGHT NEED IT ────────────────
    #
    # `node --test` prints one summary block per invocation, and
    # `bin/prime --contracts` runs TWO of them: 16 tests for the offline tier
    # and 6 for the contract tier. Both blocks are the same shape —
    #
    #     1..16
    #     # tests 16
    #     # pass 16
    #     # skipped 0
    #
    # — and the checker reads the floor from the **last** match. So a bare
    # `^# pass ([0-9]+)$` on this gate silently reads **6**, the contract tier,
    # and a floor of 16 would be `gate.floor` on a fully green run; worse, a
    # floor of 6 would be satisfied by the offline tier's 16 on a run where the
    # contract tier never executed at all. Neither is a bug to be discovered
    # later — both are the thing `core`'s own `docs/gate.md` warns about when it
    # says "write patterns specific enough that this cannot bite".
    #
    # So the four tier proofs are anchored to the `== …` banner that
    # `bin/prime`'s own `step()` prints immediately before that tier runs, and
    # the prefix is `.*?` — **non-greedy**, so the match is the tier's FIRST
    # summary rather than the run's last. `(?s)` is needed because the banner
    # and the summary are different lines; it is placed first because Python
    # requires a global inline flag at the start of the expression.
    #
    # What that buys is worth stating plainly: run `bin/prime` without
    # `--contracts` and these four are **absent**, which is `gate.proof-missing`
    # — a FAILURE. A developer who runs the short gate and then checks the
    # declaration against it gets red, which is the correct answer, because the
    # short gate is not this gate.
    #
    # 1. The offline tier's own count. This is the decrease-detector for the
    #    tier that checks the text: 103 shell fences parse, 11 JSON fences are
    #    valid JSON, every `#fragment` names a heading that exists, every
    #    internal link resolves, every sidebar slug is in `dist/`. 16 is
    #    measured on this tree.
    #
    #    It is also the floor that catches the defect this packet's own
    #    preamble describes. Deleting `tests/links.mjs` and
    #    `tests/examples.mjs` from the `test` script leaves a **green** gate at
    #    7 tests — and `gate.floor` is red. That breakage was run rather than
    #    reasoned about; the transcript is in `REPORT-docs-06-gate.md` under
    #    "the red proofs".
    - id: offline-suite
      match: '(?s)^== npm test\n.*?^# pass ([0-9]+)$'
      # 16 exactly, measured — NOT 22, which is the whole run, and NOT 6, which
      # is what an unanchored pattern would have read. And not a rounded number:
      # this repository deliberately holds 16 by *equality* in CI
      # (`BASELINE_TESTS`), because a floor would accept a suite that lost
      # tests/links.mjs and tests/examples.mjs entirely.
      minimum: 16
    #
    # 2. Nothing skipped in the offline tier. This is a separate proof because
    #    the count above **cannot** see it, and the case is measured rather than
    #    imagined: rewriting a test as `test.skip` raises `# tests` and leaves
    #    `# pass` at 16. The number this floor reads does not move; `# skipped` is
    #    the only line that does. Every test in the offline tier is
    #    unconditional by construction — `tests/contracts.mjs` holds the
    #    environment-gated checks and is a separate file — so a skip here means
    #    something changed that nobody read, and `AGENTS.md` says the build is
    #    red on a single skip.
    - id: offline-no-skip
      match: '(?s)^== npm test\n.*?^# skipped 0$'
    #
    # 3. The contract tier ran, at its measured size. **This is the
    #    load-bearing proof in this file.** Its absence is what a green
    #    `gate-check --prove` over an unrun tier looks like, and this repository
    #    is the shape that produces one: `bin/prime` without the flag prints
    #    "skipping the contract tier (--contracts); it did NOT run" and exits 0.
    #    Six tests, measured.
    - id: contract-tier-ran
      match: '(?s)^== npm run test:contracts.*?^# pass ([0-9]+)$'
      minimum: 6
    #
    # 4. Nothing skipped in the contract tier either, anchored the same way.
    #    The two `# skipped 0` blocks are identical strings, so an unanchored
    #    pattern would be satisfied by either tier's line and would assert
    #    nothing about the other.
    - id: contract-no-skip
      match: '(?s)^== npm run test:contracts.*?^# skipped 0$'
    #
    # 5. The documented manifests went through the real validator. 2, measured:
    #    the ```yaml fences in the prose, both of them. This is the count an
    #    extractor that stopped matching would silently take to zero, and
    #    `tests/contracts.mjs` asserts it is non-zero for the same reason — this
    #    proof is the independent reading of the same number.
    - id: manifests-validated-by-caf
      match: '^#.*\\# manifests validated by caf contract lint: ([0-9]+)$'
      minimum: 2
    #
    # 6. **The real `caf` binary produced real output, and nothing else can
    #    produce this line.** No floor, because the line reports nothing
    #    countable — it is `caf contract lint`'s own stdout, printed by the test.
    #
    #    This is the proof for the failure the packet's preamble names by hand:
    #    "a checker replaced by a function that unconditionally exits 0 would
    #    leave this repository green". Point `CAF` at `/usr/bin/true` and the
    #    validator accepts every manifest, the test passes, and the count line
    #    above still prints `2` — because that `console.log` is in the test, not
    #    in `caf`. This line is different: it is `caf`'s own stdout, naming this
    #    repository's own manifest. `/bin/true` emits nothing, so the log line
    #    is `#` and this proof is `gate.proof-missing`.
    #
    #    **What it is coupled to, stated rather than left for the next reader to
    #    discover:** the phrase `OK <path>` is `caf`'s, not this repository's.
    #    If `caf` rewords it, this proof goes red and says so, and the fix is to
    #    update it here in the same commit. That coupling is the intended
    #    direction of travel — a proof that can only be satisfied by the real
    #    tool is worth more than one that would survive the real tool being
    #    replaced.
    - id: caf-lint-output
      match: '^#.*\\# OK \S+/cafaye\.yml$'
    #
    # 7. The prose's event-type claims were checked against **core's real
    #    catalog**, not a list written beside it. 8 claims against the 30 types
    #    core publishes, measured. `.` in `core.s` is the apostrophe in `core's`
    #    — it is not counting a position, which is the only way core's docs warn
    #    a `.` in a proof can be dangerous.
    #
    #    The parenthetical is in the pattern on purpose: the count is only
    #    meaningful beside the catalog size it was checked against, and a
    #    pattern that ignored it would still be green if the extractor had begun
    #    parsing a different document.
    - id: event-claims-checked
      match: "^#.*\\\\# event-type claims checked against core.s catalog: ([0-9]+) \\(core publishes [0-9]+\\)$"
      minimum: 8
    #
    # 8. And the other grammar, against the other schema: observability.md's
    #    span names against core's `schemas/telemetry/span-naming.schema.json`
    #    pattern, read out of core at run time rather than restated here. 6 good
    #    names, measured, with the 4 "Never:" examples behind the same
    #    assertion in the same test.
    #
    #    **These last four are not proof that `core` is reachable.** They are
    #    proof that the numbers this tier prints are on the page, and
    #    `contract-tier-ran` above is what forces the tier to have run. A proof
    #    is a line of output; core's own `docs/gate.md` says so plainly, in its
    #    own "What this does not prove" section.
    - id: span-names-checked
      match: "^#.*\\\\# span names checked against core.s pattern: ([0-9]+) good, [0-9]+ rejected$"
      minimum: 6

external:
  # FALSE, and every one of the four entries below was demonstrated on this
  # machine rather than reasoned about. `selfContained: true` would be a claim
  # that the gate needs nothing but this repository; it needs an interpreter and
  # a pinned node that this repository does not carry, a package registry on
  # **every** run rather than once, a Go binary from another repository, and a
  # checkout of a third. A declaration that said `true` would be describing a
  # gate nobody has ever run on a clean machine — the same defect as identity's
  # suite being green against a database nobody had migrated, told the other way
  # round.
  selfContained: false
  requirements:
    # Demonstrated: `env -i PATH=/usr/bin:/bin bash bin/prime` prints the line
    # quoted below and exits 127. `bin/prime` deliberately does **not** run
    # `mise install` — it refuses rather than installing a toolchain behind your
    # back — so this is the operator's to satisfy before gating.
    #
    # The pin is not decoration either. `astro@7` needs `>=22.12.0` and
    # `undici@8.11.2` asks for `>=22.19.0`, so a runner on node 20 fails the
    # build for a reason that has nothing to do with this repository's content.
    - kind: toolchain
      name: node 22.19.0 and the npm that ships with it, the pin in mise.toml, repeated as engines.node in package.json
      satisfy:
        # A bare name, so this is a claim about THIS MACHINE and the checker
        # deliberately does not run it: `gate.requirement-unproven` is a warning
        # and never moves the exit code. That warning is correct — failing on it
        # would be red on a laptop and green on CI.
        command: [mise, install]
        unmet: >-
          bin/prime: node not found on PATH — run 'mise install' in this
          worktree (exit 127)
    # Demonstrated: `npm ci --offline` against an empty cache, run on a copy of
    # this repository's package.json and package-lock.json so the working tree
    # was not touched, prints the line quoted below, exits 1, and leaves no
    # `node_modules/`.
    #
    # **And it is not "once, on a cold checkout",** which is how the other
    # repositories in this fleet spell it and which is a real difference here.
    # `npm ci` deletes `node_modules` and reinstalls the lockfile from scratch on
    # EVERY run, so this is a requirement on every gate run and a warm `~/.npm`
    # cache is the only reason nobody notices. A warm offline run needs nothing;
    # an air-gapped runner with a warm cache is green and one with a cold cache
    # cannot even reach step two.
    - kind: network
      name: the npm registry, on EVERY run — the 278 packages package-lock.json pins; a warm ~/.npm cache is what makes it invisible
      satisfy:
        # Repository-relative, so the checker verifies the file is there: a
        # requirement satisfied by a file that does not exist is a pointer to a
        # page that does not exist, which is what this field replaced.
        command: [npm, ci]
        unmet: >-
          npm error code ENOTCACHED — npm error request to
          https://registry.npmjs.org/zwitch/-/zwitch-2.0.4.tgz failed: cache
          mode is 'only-if-cached' but no cached response is available, and no
          node_modules/ is left behind (exit 1)
    # Demonstrated: `CAF=/nonexistent/caf npm run test:contracts` fails at the
    # tier's second test and exits 1. **This is a failure and never a skip**,
    # which is the property worth declaring: a contract check that cannot find
    # the contract converts an unknown into a green badge.
    #
    # It is a `toolchain` rather than a `filesystem` requirement because it is a
    # built binary from another repository, not a checkout; CI builds it from
    # source (`git clone cafaye/caf && go build ./cmd/caf`) rather than
    # downloading a release, so it cannot break because a published artifact
    # disappeared.
    - kind: toolchain
      name: the caf binary, built from a checkout of cafaye/caf — `go build ./cmd/caf` — on PATH or at $CAF
      satisfy:
        # A bare name, and therefore a claim about this machine that the checker
        # reports as unproven rather than settling. `caf version` is the command
        # that proves it runs without doing any work.
        command: [caf, version]
        unmet: >-
          the caf binary (/nonexistent/caf) could not be run: spawnSync
          /nonexistent/caf ENOENT, and the tier exits 1 at its second test
    # Demonstrated: `CORE_PATH=/tmp/no-such-core npm run test:contracts` fails at
    # the tier's **first** test, exits 1, and says so in the assertion message.
    # Two of the three environment variables this gate honours are named here —
    # `CORE_PATH` and `CAF` — because they are the only two seams in the whole
    # tier and neither can be asserted from a file in this repository.
    #
    # **Which is why `contract-tier-ran` above is a proof and this is only a
    # requirement.** A requirement says what to get; a proof says the gate may
    # not be green without it. `tests/contracts.mjs` resolves core at
    # `CORE_PATH`, or a **sibling** checkout, so a contributor who cloned core
    # next to this worktree satisfies it with no environment variable at all.
    - kind: filesystem
      name: a readable cafaye/core checkout — $CORE_PATH, or a core directory beside this repository, holding schemas/ and docs/event-naming.md
      satisfy:
        # Repository-relative and checked on disk. This is the argv that
        # actually reaches core: `bin/prime` without the flag never reads it.
        command: [bin/prime, --contracts]
        unmet: >-
          core is not readable at /tmp/no-such-core. This tier reads core's real
          manifest schema and cannot run without it. Set CORE_PATH, or put core
          next to this worktree. (exit 1, at the tier's first test)
  # NOT required, and named here so nobody goes looking for them: **no
  # credential, no secret, no token, no database, no service, no container, and
  # no network after npm's cache is warm.** Nothing in this repository's gate
  # reads an environment variable whose name looks like a secret; the only two
  # it reads are `CORE_PATH` and `CAF`, and both are paths. `.github/workflows/ci.yml`
  # takes `permissions: contents: read` and no `secrets:` at all, because
  # `cafaye/core` and `cafaye/caf` are public and the default `GITHUB_TOKEN`
  # reads both — a gate that needed a credential would be the only thing in this
  # repository that did, and its own `pins` job fails the build if one appears.
  #
  # The last one is the one that would be got wrong here, because
  # `tests/links.mjs` exists precisely to keep the SUITE offline and it holds:
  # all 50 external links are checked for shape with no network at all. The gate
  # is a different question. `npm ci` reaches the registry before any test runs,
  # so the offline suite does not make the offline gate.

ci:
  # The workflow, and the argv it runs there. Both elements of `invokes` appear
  # in a `run:` body of `ci.yml` — `bin/prime` in the `gate` job at its
  # bin/prime step, and `bin/prime --contracts` in the `contracts` job — so
  # `gate.ci-disagrees` is satisfied, and a future edit that drops either is a
  # red rather than a quiet divergence.
  workflow: .github/workflows/ci.yml
  invokes: [bin/prime, --contracts]
  #
  # **WHAT CI ADDS THAT `bin/prime` DOES NOT, because this is the difference
  # worth catching and it is not visible to the checker.** `ci.invokes` is read
  # textually, so the three assertions the `gate` job makes *around* the gate are
  # invisible to it, and they are not nothing:
  #
  #   1. **Suite size by equality.** `BASELINE_TESTS: '16'` is compared with
  #      `==`, not with a floor, so adding a test is red until it is raised in
  #      the same commit. The floor above is 16 too, and a floor is the weaker of
  #      the two: this format cannot express equality, so the number a person has
  #      to look at before raising it lives in the workflow, not here.
  #   2. **`# skipped` must be zero**, which `offline-no-skip` above also
  #      asserts for the same run. Duplicated deliberately, in the place that
  #      fails the build.
  #   3. **The tree is byte-identical after the gate** — `git diff --exit-code`
  #      plus `git status --porcelain` over the tracked paths, because a
  #      generated file that stopped being committed looks exactly like no change.
  #
  # And what CI runs that this gate does not, at all: the whole `pins` job (four
  # checks that need no toolchain and fail in seconds), and
  # `external-links.yml`, the network tier, which is a separate file on purpose.
  #
  # So the honest one-line summary is: **`./bin/prime --contracts` is green on a
  # tree that CI is red on.** Delete a test and the local gate reports 16 of 15
  # and stays quiet while `BASELINE_TESTS` fails the build; edit
  # `.github/workflows/ci.yml` to reintroduce the stale
  # `cafaye/kit/workflows/ci.reusable.yml` path and every local run is still
  # green. That gap is recorded rather than closed, and closing it would mean
  # moving CI's assertions into `bin/prime`, which is a change to the gate's
  # behaviour and not this packet's to make.